# Instance Foundry VTT isolée pour les tests E2E Cypress et Quench (cf. tests/README.md).
# Ne monte que les chemins publiés par release.yml. Prérequis : `.env` renseigné depuis
# `.env.example` et module Quench récupéré (commande dans tests/README.md).
services:
  foundryvtt:
    image: felddy/foundryvtt:release
    container_name: dnd-custom-ai-foundry-test
    env_file:
      - .env
    environment:
      - FOUNDRY_ADMIN_KEY=${FOUNDRY_ADMIN_KEY:-test-admin-key}
    ports:
      - "30001:30000"
    volumes:
      # Données, config et mondes persistés (gitignored).
      - ./data:/data
      # Système monté chemin par chemin sous /data/Data/systems/<id> (racine de données réelle de Foundry).
      - ./system.json:/data/Data/systems/dnd-custom-ai/system.json
      - ./scripts:/data/Data/systems/dnd-custom-ai/scripts
      - ./styles:/data/Data/systems/dnd-custom-ai/styles
      - ./templates:/data/Data/systems/dnd-custom-ai/templates
      - ./lang:/data/Data/systems/dnd-custom-ai/lang
      - ./assets:/data/Data/systems/dnd-custom-ai/assets
      # Pas de `:ro` : LevelDB doit écrire ses fichiers de service (LOCK, LOG…) dans ./packs.
      - ./packs:/data/Data/systems/dnd-custom-ai/packs
      - ./world-items:/data/Data/systems/dnd-custom-ai/world-items
      # Module Quench et batch de tests d'intégration, jamais livrés avec le système.
      - ./.quench-module:/data/Data/modules/quench
      - ./tests/quench:/data/Data/modules/dnd-custom-ai-quench-tests
    restart: unless-stopped
