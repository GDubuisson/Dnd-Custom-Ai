name: Release Foundry System

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version à publier (ex: 0.2.0, sans le préfixe v)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Valider la version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Format de version invalide : '$VERSION' (attendu X.Y.Z, sans préfixe v)"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Le tag v$VERSION existe déjà."
            exit 1
          fi

      - name: Mettre à jour system.json (version + download)
        run: |
          VERSION="${{ github.event.inputs.version }}"
          jq \
            --arg version "$VERSION" \
            --arg download "https://github.com/${{ github.repository }}/releases/download/v$VERSION/system.zip" \
            '.version = $version | .download = $download' \
            system.json > system.json.tmp
          mv system.json.tmp system.json

      - name: Committer et taguer la version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add system.json
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v$VERSION"

      - name: Construire l'archive du système
        run: |
          mkdir -p dist
          FILES="system.json"
          for path in template.json scripts styles templates lang assets packs; do
            if [ -e "$path" ]; then FILES="$FILES $path"; fi
          done
          zip -r dist/system.zip $FILES

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "v${{ github.event.inputs.version }}"
          generate_release_notes: true
          files: |
            system.json
            dist/system.zip
