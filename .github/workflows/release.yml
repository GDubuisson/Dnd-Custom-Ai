name: Release Foundry System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lire et valider la version (system.json)
        run: |
          VERSION="$(jq -r '.version' system.json)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version invalide dans system.json : '$VERSION' (attendu X.Y.Z)"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Le tag v$VERSION existe déjà. Incrémentez 'version' dans system.json avant de relancer ce workflow."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Mettre à jour system.json (download)
        run: |
          jq \
            --arg download "https://github.com/${{ github.repository }}/releases/download/v$VERSION/system.zip" \
            '.download = $download' \
            system.json > system.json.tmp
          mv system.json.tmp system.json

      - name: Committer et taguer la version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add system.json
          git diff --cached --quiet || git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v$VERSION"

      - name: Construire l'archive du système
        run: |
          mkdir -p dist
          FILES="system.json"
          for path in template.json scripts styles templates lang assets packs world-items; do
            if [ -e "$path" ]; then FILES="$FILES $path"; fi
          done
          zip -r dist/system.zip $FILES

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "v${{ env.VERSION }}"
          generate_release_notes: true
          files: |
            system.json
            dist/system.zip
