name: System Tests

# Suite unitaire/data/dom (`npm test`), isolée de Foundry ; complète release.yml.
# Les tests E2E Docker + Cypress se lancent en local (cf. tests/README.md).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
