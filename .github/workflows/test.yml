name: System Tests

# Suite unitaire/data/dom (cf. tests/README.md, `npm test`) — isolée de Foundry, rapide et
# fiable en CI. Complète .github/workflows/release.yml, ne le remplace pas.
#
# Les tests E2E "au réel" (vrai client Foundry via Docker + Cypress, cf. docker-compose.yml)
# restent volontairement une couche manuelle/locale uniquement : ils dépendent d'un monde de
# test déjà provisionné (utilisateurs, licence Foundry acceptée) qui n'existe pas dans un
# environnement CI éphémère, et retélécharger + réinstaller Foundry en entier à chaque run
# dépasserait largement des délais raisonnables de CI. Décision explicite (2026-08-19) plutôt
# que de maintenir un job systématiquement rouge — cf. tests/README.md pour lancer cette suite
# en local.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
